name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'The type of version to release (alpha | beta | release)'
        default: 'beta'
        required: true
        type: choice
        options:
          - "alpha"
          - "beta"
          - "release"
      ignore_spotless:
        description: 'Ignore spotlessCheck when building the project'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Caches
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Setup Gradle Wrapper
        run: chmod +x gradlew

      - name: Get Version
        id: gradle_properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: ./gradle.properties
          properties: "mod_version"

      - name: Build Project
        run: ./gradlew build --build-cache ${{ inputs.ignore_spotless && '-x spotlessCheck' || '' }}
